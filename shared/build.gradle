plugins {
    id 'com.android.library'
}
android {
    namespace 'com.example.drivemate.shared'
    compileSdk 36

    defaultConfig {
        minSdk 29
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
dependencies {
    implementation("ai.pleos.playground:Vehicle:2.0.3")

    // [2단계] 음성 안내(TTS). ON_DEVICE 모드로 쓰면 인터넷/앱 등록 없이 차량 안에서 소리를 낸다.
    implementation("ai.pleos.playground:TextToSpeech:3.3.1")

    // [1단계] 차량 속도/기어를 읽는 AAOS 'android.car' 클래스(CarPropertyManager 등)를 쓰기 위한 설정.
    // compileOnly = "컴파일할 때만 참고하고 앱에는 넣지 않음". 실제 차량(에뮬레이터)에 이미 들어 있기 때문.
    // 이 jar 파일은 Android SDK 폴더 안(platforms/android-36/optional)에 있다.
    // SDK 폴더 위치는 local.properties 파일의 sdk.dir 에서 읽어온다 (Android Studio가 자동으로 만들어 둔 파일).
    def localProps = new Properties()
    rootProject.file("local.properties").withInputStream { localProps.load(it) }
    compileOnly files("${localProps.getProperty('sdk.dir')}/platforms/android-36/optional/android.car.jar")
}